version: "3.9"

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  api-gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MODE=production
      - PORT=8080
    depends_on:
      - redis
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway

  kernel-service:
    build:
      context: ..
      dockerfile: deploy/kernel-service/Dockerfile
    environment:
      - MODE=production

  agent-service:
    build:
      context: ..
      dockerfile: deploy/agent-service/Dockerfile
    environment:
      - MODE=production

  business-service:
    build:
      context: ..
      dockerfile: deploy/business-service/Dockerfile
    environment:
      - MODE=production

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=profitos
      - POSTGRES_USER=profitos
      - POSTGRES_PASSWORD=profitos
