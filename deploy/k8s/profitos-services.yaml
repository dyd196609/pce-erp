apiVersion: v1
kind: Service
metadata:
  name: profitos-kernel
spec:
  selector:
    app: profitos-kernel
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profitos-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profitos-gateway
  template:
    metadata:
      labels:
        app: profitos-gateway
    spec:
      containers:
        - name: gateway
          image: profitos/gateway:v1
          env:
            - name: MODE
              value: production
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: profitos-gateway
spec:
  selector:
    app: profitos-gateway
  ports:
    - port: 8080
      targetPort: 8080
